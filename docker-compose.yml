services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: evalops
      POSTGRES_USER: evalops
      POSTGRES_PASSWORD: evalops
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalops -d evalops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: evalops
      MINIO_ROOT_PASSWORD: evalops-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      DATABASE_URL: postgres://evalops:evalops@postgres:5432/evalops
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-at-least-32-random-characters}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-replace-with-at-least-32-random-characters}
      EVALOPS_INLINE_RUNS: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: evalops-artifacts
      S3_ACCESS_KEY_ID: evalops
      S3_SECRET_ACCESS_KEY: evalops-secret
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://evalops:evalops@postgres:5432/evalops
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-at-least-32-random-characters}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-replace-with-at-least-32-random-characters}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: evalops-artifacts
      S3_ACCESS_KEY_ID: evalops
      S3_SECRET_ACCESS_KEY: evalops-secret
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
